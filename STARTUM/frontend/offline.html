<!doctype html>
<html lang="uz">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width,initial-scale=1,viewport-fit=cover"
    />
    <meta name="theme-color" content="#123b46" />
    <meta name="robots" content="noindex,nofollow" />
    <title>STARTUM — Aloqa mavjud emas</title>
    <style>
      :root {
        color-scheme: light;
        --ink: #123b46;
        --mint: #a8f0d1;
        --paper: #f2f7f3;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 24px;
        background:
          radial-gradient(
            circle at 15% 10%,
            rgba(168, 240, 209, 0.55),
            transparent 35%
          ),
          var(--paper);
        color: var(--ink);
        font:
          16px/1.6 Inter,
          system-ui,
          sans-serif;
      }
      main {
        width: min(100%, 520px);
        padding: clamp(24px, 6vw, 42px);
        border: 1px solid rgba(18, 59, 70, 0.14);
        border-radius: 26px;
        background: rgba(255, 255, 255, 0.9);
        box-shadow: 0 24px 70px rgba(18, 59, 70, 0.12);
      }
      .mark {
        display: inline-grid;
        place-items: center;
        width: 48px;
        height: 48px;
        border-radius: 15px;
        background: var(--mint);
        font: 800 20px/1 system-ui;
      }
      h1 {
        margin: 22px 0 8px;
        font: 800 clamp(28px, 6vw, 38px)/1.12 system-ui;
      }
      p {
        margin: 0;
        color: #526b73;
      }
      a {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        min-height: 46px;
        margin-top: 24px;
        padding: 0 20px;
        border-radius: 13px;
        background: var(--ink);
        color: #fff;
        text-decoration: none;
        font-weight: 700;
      }
    </style>
  </head>
  <body>
    <main>
      <span class="mark" aria-hidden="true">S</span>
      <h1>Internet aloqasi yo‘q</h1>
      <p>
        STARTUM sahifasini yuklash uchun internet aloqasi kerak. Ulanish
        tiklangach qayta urinib ko‘ring.
      </p>
      <a href="./">Qayta urinish</a>
    </main>
  </body>
</html>
